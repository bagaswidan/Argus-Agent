# Argus — docker compose (Phase 9)
#
# Run:   docker compose up -d
# Open:  http://localhost:8787  (dashboard)
#
# Two services:
#   argus      — the CLI/framework, mounts the data volume
#   dashboard  — web dashboard over the observability store
services:
  argus:
    build: .
    image: argus:latest
    container_name: argus
    environment:
      ARGUS_DEFAULT_MODEL: ${ARGUS_DEFAULT_MODEL:-Cadangan}
      ARGUS_BASE_URL: ${ARGUS_BASE_URL:-http://host.docker.internal:20128/v1}
    env_file:
      - path: .env
        required: false
    volumes:
      - argus-data:/data
    command: ["status"]

  dashboard:
    build: .
    image: argus:latest
    container_name: argus-dashboard
    environment:
      ARGUS_DASHBOARD_DB: /data/dashboard.db
    volumes:
      - argus-data:/data
    ports:
      - "8787:8787"
    command: ["dashboard", "--host", "0.0.0.0", "--port", "8787", "--db", "/data/dashboard.db"]
    depends_on:
      - argus

volumes:
  argus-data:
