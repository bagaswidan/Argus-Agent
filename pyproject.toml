[project]
name = "argus"
version = "1.1.0"
description = "An AI agent framework that observes everything, keeps receipts, and doesn't guess."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Bagas Widya Ananta" }]
keywords = ["ai", "agent", "llm", "framework", "orchestration", "sandbox", "reflection", "observability"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.3,<3",
    "typer>=0.12,<1",
    "structlog>=24.1,<26",
    "pyyaml>=6.0,<7",
    "python-json-logger>=2.0,<4",
    "rich>=13.7,<14",
    "cryptography>=42.0,<51",
]
[project.urls]
Homepage = "https://github.com/bagas/argus"
Repository = "https://github.com/bagas/argus"
Documentation = "https://github.com/bagas/argus/blob/main/README.md"
[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10",
    "pytest-cov>=5.0,<7",
    "pytest-asyncio>=0.23,<2",
    "pytest-mock>=3.14,<4",
    "ruff>=0.5,<1",
    "black>=24.3,<26",
    "mypy>=1.10,<2",
    "hypothesis>=6.100,<7",
    "pillow>=10.0,<13",
    "aiohttp>=3.9,<4",
]
[project.scripts]
argus = "argus.cli.main:app"
[tool.setuptools.packages.find]
where = ["src"]
include = ["argus*"]
[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "black>=24.3",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "pillow>=10.0,<13",
]
[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP", "W", "C4", "C90", "N", "D", "T20", "ARG", "PTH", "ERA", "SIM", "TCH", "RUF", "LOG", "RET", "PL", "TRY", "ASYNC", "PD", "NPY", "COM", "Q", "C"]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    "TRY003",   # long exception messages are intentional with error model
    "PLC0415",  # lazy imports for cold-start performance
    "D401",     # docstring imperative mood — too strict for existing code
    "PLR0913",  # too many arguments — pydantic constructors
    "PLR0917",  # too many positional arguments
    "PLR0915",  # too many statements — intentional in complex modules
    "PLR2004",  # magic values — TODO: extract constants incrementally
    "C901",     # complexity — intentional in orchestrator/engine
    "ARG001",   # unused function args — required by interface contracts
    "ARG002",   # unused method args — required by interface contracts
    "N806",     # non-lowercase variable — intentional in math/ai conventions
    "F401",     # unused imports for TYPE_CHECKING re-exports
    "RUF003",   # unicode in comments — intentional for emoji/logs
    "PTH123",   # open() vs Path — Path preferred but open() ok in some cases
    "PLW0603",  # global statement — intentional for DI container
    "TRY301",   # raise within try — intentional in recovery paths
    "TRY300",   # try-consider-else — style preference
    "TRY401",   # verbose log messages — intentional with structlog
    "E501",     # line length — handled by formatter (black), not linter
]
[tool.black]
line-length = 100
target-version = ["py312"]
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
