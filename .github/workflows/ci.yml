name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package
        id: install
        run: |
          pip install -e ".[dev]" 2>&1 | tee /tmp/install_out.txt
          exit ${PIPESTATUS[0]}
        shell: bash

      - name: Run test suite
        id: tests
        run: |
          python -m pytest tests/ -q --tb=short 2>&1 | tee /tmp/test_out.txt
          exit ${PIPESTATUS[0]}
        shell: bash
        env:
          PYTHONPATH: src

      - name: Report failures as annotations
        if: failure()
        run: |
          if [ -f /tmp/test_out.txt ]; then
            grep -E "FAILED|ERROR|ModuleNotFound|ImportError" /tmp/test_out.txt | head -30 | while IFS= read -r line; do
              echo "::error file=tests::$line"
            done
          fi
          if [ -f /tmp/install_out.txt ]; then
            grep -iE "error|failed|no matching|conflict" /tmp/install_out.txt | head -20 | while IFS= read -r line; do
              echo "::error file=pyproject.toml::$line"
            done
          fi
        shell: bash
