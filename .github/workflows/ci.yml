name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package
        run: |
          pip install -e ".[dev]" 2>&1 | tee /tmp/install_out.txt
          exit ${PIPESTATUS[0]}
        shell: bash

      - name: Run test suite
        run: |
          python -m pytest tests/ -q --tb=short 2>&1 | tee /tmp/test_out.txt
          exit ${PIPESTATUS[0]}
        shell: bash
        env:
          PYTHONPATH: src

      - name: Lint with ruff
        run: |
          ruff check src 2>&1 | tee /tmp/ruff_out.txt
          exit ${PIPESTATUS[0]}
        shell: bash

      - name: Type check with mypy
        run: |
          mypy src 2>&1 | tee /tmp/mypy_out.txt
          exit ${PIPESTATUS[0]}
        shell: bash
        env:
          PYTHONPATH: src

      - name: Report failures as annotations
        if: failure()
        run: |
          {
            echo "::group::test output"
            tail -80 /tmp/test_out.txt 2>/dev/null || echo "NO TEST OUTPUT FILE"
            echo "::endgroup::"
            echo "::group::ruff output"
            tail -40 /tmp/ruff_out.txt 2>/dev/null || echo "NO RUFF OUTPUT FILE"
            echo "::endgroup::"
            echo "::group::mypy output"
            tail -40 /tmp/mypy_out.txt 2>/dev/null || echo "NO MYPY OUTPUT FILE"
            echo "::endgroup::"
            echo "::group::install output"
            tail -30 /tmp/install_out.txt 2>/dev/null || echo "NO INSTALL OUTPUT FILE"
            echo "::endgroup::"
          } | sed 's/^/::error::/' || true
          exit 0
        shell: bash
